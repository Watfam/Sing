<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sing — Josiah Queen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171310;
    --surface:#221c17;
    --surface-2:#2b241d;
    --gold:#c9a13b;
    --gold-dim:#8d7333;
    --rust:#a8552e;
    --cream:#ece4d3;
    --muted:#948a76;
    --denim:#4a6579;
    --border:#3a332a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#0e0c0a;
    font-family:'Work Sans', sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 16px;
    min-height:100vh;
  }
  .phone{
    width:390px;
    max-width:100%;
    background:var(--bg);
    border-radius:32px;
    border:6px solid #100d0a;
    overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,0.5);
    color:var(--cream);
  }
  .statusbar{
    height:28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.5px;
  }
  .content{
    height:720px;
    overflow-y:auto;
    padding-bottom:24px;
  }
  .content::-webkit-scrollbar{width:0;}

  /* On an actual phone, drop the mockup bezel/frame and fill the real screen */
  @media (max-width: 480px){
    body{
      padding:0;
      display:block;
    }
    .phone{
      width:100%;
      max-width:none;
      min-height:100vh;
      min-height:100dvh;
      border-radius:0;
      border:none;
      box-shadow:none;
    }
    .content{
      height:calc(100vh - 28px);
      height:calc(100dvh - 28px);
    }
    .overlay{
      position:fixed;
    }
  }

  .hero{
    margin:8px 16px 20px;
    padding:22px 20px;
    border-radius:18px;
    background:linear-gradient(160deg, #2c2318, #1a140e);
    border:1px solid var(--border);
    position:relative;
  }
  .hero-label{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 6px;
  }
  .hero-title{
    font-family:'Fraunces', serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 4px;
    line-height:1.15;
  }
  .hero-sub{
    font-size:13px;
    color:var(--muted);
    margin:0 0 16px;
  }
  .hero-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--gold);
    color:#241c0f;
    border:none;
    padding:10px 18px;
    border-radius:999px;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }

  .section-title{
    font-family:'Fraunces', serif;
    font-size:15px;
    font-weight:600;
    color:var(--cream);
    margin:24px 20px 10px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .section-title small{
    font-family:'Work Sans', sans-serif;
    font-size:11px;
    color:var(--muted);
    font-weight:400;
  }

  .album{
    margin:0 16px 12px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--surface);
    overflow:hidden;
  }
  .album-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    cursor:pointer;
  }
  .album-art{
    width:46px;
    height:46px;
    border-radius:8px;
    background:linear-gradient(150deg, var(--denim), #263440);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-weight:600;
    color:var(--cream);
    font-size:16px;
  }
  .album-meta{flex:1; min-width:0;}
  .album-name{
    font-family:'Fraunces', serif;
    font-size:15px;
    font-weight:500;
    margin:0 0 2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .album-year{
    font-size:12px;
    color:var(--muted);
    margin:0;
  }
  .chev{
    color:var(--muted);
    font-size:18px;
    transition:transform 0.2s ease;
    flex-shrink:0;
  }
  .album.open .chev{transform:rotate(90deg);}

  .songs{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.25s ease;
    border-top:1px solid transparent;
  }
  .album.open .songs{
    max-height:600px;
    border-top:1px solid var(--border);
  }
  .song{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 16px 11px 58px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .song:last-child{border-bottom:none;}
  .song:active{background:var(--surface-2);}
  .song-name{
    flex:1;
    font-size:13.5px;
    color:var(--cream);
  }
  .song-note{
    font-size:11px;
    color:var(--gold-dim);
  }
  .play-dot{
    width:26px;
    height:26px;
    border-radius:50%;
    border:1px solid var(--gold-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    font-size:11px;
    flex-shrink:0;
  }

  .overlay{
    position:absolute;
    inset:0;
    background:rgba(10,8,6,0.6);
    display:flex;
    align-items:flex-end;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease;
    z-index:5;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .phone{position:relative;}
  .phone::before{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at 50% 18%, rgba(255,235,190,0.55), rgba(255,235,190,0) 65%);
    mix-blend-mode:screen;
    pointer-events:none;
    z-index:1;
  }


  .sheet{
    width:100%;
    background:var(--surface);
    border-top:1px solid var(--border);
    border-radius:20px 20px 0 0;
    padding:18px 20px 26px;
    transform:translateY(100%);
    transition:transform 0.25s ease;
  }
  .overlay.show .sheet{transform:translateY(0);}
  .sheet-handle{
    width:36px;
    height:4px;
    background:var(--border);
    border-radius:2px;
    margin:0 auto 16px;
  }
  .sheet-song{
    font-family:'Fraunces', serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 2px;
  }
  .sheet-album{
    font-size:12px;
    color:var(--muted);
    margin:0 0 18px;
  }
  .sheet-link{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:10px;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--cream);
    text-decoration:none;
    font-size:13.5px;
    margin-bottom:10px;
  }
  .sheet-link .dot{
    width:8px; height:8px; border-radius:50%;
  }
  .close-sheet{
    display:block;
    margin:14px auto 0;
    background:none;
    border:none;
    color:var(--muted);
    font-size:13px;
    cursor:pointer;
  }

  .disc-note{
    margin:20px 20px 0;
    font-size:11.5px;
    color:var(--muted);
    line-height:1.5;
    padding-top:14px;
    border-top:1px solid var(--border);
  }

  .home-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    min-height:600px;
    padding:0 20px 20px;
    text-align:center;
  }
  .home-title{
    font-family:'Fraunces', serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 4px;
  }
  .home-sub{
    font-size:13px;
    color:var(--muted);
    margin:0 0 22px;
  }
  .home-card{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    border-radius:14px;
    background:rgba(34,28,23,0.75);
    border:1px solid var(--border);
    margin-bottom:12px;
    cursor:pointer;
    text-align:left;
  }
  .home-card .album-art{
    width:44px;
    height:44px;
    border-radius:8px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-weight:600;
    color:var(--cream);
  }
  .home-card-text p{margin:0;}
  .home-card-name{
    font-family:'Fraunces', serif;
    font-size:15px;
    font-weight:500;
  }
  .home-card-sub{
    font-size:12px;
    color:var(--muted);
  }

  .splash{
    position:absolute;
    inset:0;
    z-index:20;
    background: radial-gradient(ellipse at 50% 30%, #2c2318, #100d0a 75%);
    border-radius:26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    transition:opacity 0.35s ease;
    cursor:pointer;
  }
  .app-icon{
    width:96px;
    height:96px;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 12px 26px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
    cursor:pointer;
  }
  .app-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
    pointer-events:none;
  }
  .app-icon-label{
    text-align:center;
    color:var(--cream);
    font-family:'Fraunces', serif;
    font-size:14px;
    font-weight:500;
    line-height:1.4;
    margin:0;
  }
  .splash.hide{
    opacity:0;
    pointer-events:none;
  }

  .switcher{
    display:flex;
    gap:8px;
    margin:12px 16px 4px;
  }
  .switch-btn{
    flex:1;
    text-align:center;
    padding:9px 10px;
    border-radius:999px;
    border:1px solid var(--border);
    background:rgba(34,28,23,0.6);
    color:var(--muted);
    font-family:'Work Sans', sans-serif;
    font-size:12.5px;
    font-weight:500;
    cursor:pointer;
  }
  .switch-btn.active{
    background:var(--gold);
    color:#241c0f;
    border-color:var(--gold);
  }
</style>

              <p class="home-card-name">Forrest Frank</p>

          </div>

      return;
    }

    const data = ARTISTS[key];

    heroEl.innerHTML = `
      <div class="hero">
        <p class="hero-label">New release</p>
        <p class="hero-title">${data.hero.title}</p>
        <p class="hero-sub">${data.hero.sub}</p>
        <button class="hero-btn" onclick="openSheet('${esc(data.hero.song)}','${esc(data.hero.album)}','${esc(data.name)}')">▸ Listen now</button>
      </div>
    `;

    albumsEl.innerHTML = data.sections.map((sec, i) => `
      <p class="section-title">${sec.title} <small>${sec.tag}</small></p>
      <div class="album" data-album="${i}">
        <div class="album-head" onclick="toggleAlbum(this)">
          <div class="album-art">${sec.art}</div>
          <div class="album-meta">
            <p class="album-name">${sec.name}</p>
            <p class="album-year">${sec.meta}</p>
          </div>
          <span class="chev">›</span>
        </div>
        <div class="songs">
          ${sec.songs.map(s => `
            <div class="song" onclick="openSheet('${esc(s.name)}','${esc(s.album)}','${esc(data.name)}')">
              <span class="song-name">${s.name}${s.note ? ` <span class="song-note">${s.note}</span>` : ''}</span>
              <span class="play-dot">▸</span>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  function esc(str){
    return String(str).replace(/'/g, "\\'");
  }

  function toggleAlbum(head){
    const album = head.parentElement;
    const wasOpen = album.classList.contains('open');
    document.querySelectorAll('.album.open').forEach(a => a.classList.remove('open'));
    if(!wasOpen) album.classList.add('open');
  }

  function openSheet(song, albumLabel, artistName){
    document.getElementById('sheetSong').textContent = song;
    document.getElementById('sheetAlbum').textContent = albumLabel;
    const q = encodeURIComponent(song.replace(/\(.*?\)/g,'').trim() + ' ' + (artistName || 'Josiah Queen'));
    document.getElementById('linkSpotify').href = `https://open.spotify.com/search/${q}`;
    document.getElementById('linkApple').href = `https://music.apple.com/search?term=${q}`;
    document.getElementById('linkYoutube').href = `https://www.youtube.com/results?search_query=${q}`;
    document.getElementById('linkLyrics').href = `https://genius.com/search?q=${q}`;
    document.getElementById('overlay').classList.add('show');
  }
  function closeSheet(){
    document.getElementById('overlay').classList.remove('show');
  }

  function dismissSplash(){
    document.getElementById('splash').classList.add('hide');
  }

  renderArtist('home');
</script>
