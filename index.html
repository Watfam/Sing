<meta name="theme-color" content="#171310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sing">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171310;
    --surface:#221c17;
    --surface-2:#2b241d;
    --gold:#c9a13b;
    --gold-dim:#8d7333;
    --rust:#a8552e;
    --cream:#ece4d3;
    --muted:#948a76;
    --denim:#4a6579;
    --border:#3a332a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#0e0c0a;
    font-family:'Work Sans', sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 16px;
    min-height:100vh;
  }
  .phone{
    width:390px;
    max-width:100%;
    background:var(--bg);
    border-radius:32px;
    border:6px solid #100d0a;
    overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,0.5);
    color:var(--cream);
  }
  .statusbar{
    height:28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.5px;
  }
  .content{
    height:720px;
    overflow-y:auto;
    padding-bottom:24px;
  }
  .content::-webkit-scrollbar{width:0;}
  .content.has-now-playing{
    padding-bottom:80px;
  }

  .now-playing-bar{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    display:none;
    align-items:center;
    gap:12px;
    padding:10px 16px;
    background:var(--surface);
    border-top:1px solid var(--border);
    z-index:4;
    cursor:pointer;
  }
  .now-playing-bar.show{
    display:flex;
  }
  .now-playing-bar:active{
    background:var(--surface-2);
  }
  .np-art{
    width:36px;
    height:36px;
    border-radius:8px;
    background:linear-gradient(160deg, #2c2318, #1a140e);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    font-size:14px;
    flex-shrink:0;
  }
  .np-info{
    flex:1;
    min-width:0;
  }
  .np-song{
    font-size:13px;
    color:var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .np-artist{
    font-size:11px;
    color:var(--gold-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .now-playing-bar .np-play{
    width:26px;
    height:26px;
    border-radius:50%;
    border:1px solid var(--gold-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    font-size:11px;
    flex-shrink:0;
  }

  /* On an actual phone, drop the mockup bezel/frame and fill the real screen */
  @media (max-width: 480px){
    body{
      padding:0;
      display:block;
    }
    .phone{
      width:100%;
      max-width:none;
      min-height:100vh;
      min-height:100dvh;
      border-radius:0;
      border:none;
      box-shadow:none;
    }
    .content{
      height:calc(100vh - 28px);
      height:calc(100dvh - 28px);
    }
    .overlay{
      position:fixed;
    }
  }

  .hero{
    margin:8px 16px 20px;
    padding:22px 20px;
    border-radius:18px;
    background:linear-gradient(160deg, #2c2318, #1a140e);
    border:1px solid var(--border);
    position:relative;
  }
  .hero-label{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 6px;
  }
  .hero-title{
    font-family:'Fraunces', serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 4px;
    line-height:1.15;
  }
  .hero-sub{
    font-size:13px;
    color:var(--muted);
    margin:0 0 16px;
  }
  .hero-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--gold);
    color:#241c0f;
    border:none;
    padding:10px 18px;
    border-radius:999px;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }

  .bio-card{
    margin:18px 20px 0;
    padding:14px 16px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
  }
  .bio-stats{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
  }
  .bio-stat{
    font-size:11px;
    color:var(--gold-dim);
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:999px;
    padding:4px 10px;
  }
  .bio-stat b{
    color:var(--cream);
    font-weight:600;
  }
  .bio-text{
    font-size:12.5px;
    line-height:1.55;
    color:var(--muted);
    max-height:38px;
    overflow:hidden;
    transition:max-height 0.25s ease;
  }
  .bio-text.expanded{
    max-height:400px;
  }
  .bio-toggle{
    margin-top:8px;
    font-size:12px;
    font-weight:600;
    color:var(--gold);
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
    font-family:'Work Sans', sans-serif;
  }

  .tour-card{
    margin:14px 20px 0;
    padding:14px 16px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
  }
  .tour-title{
    font-family:'Fraunces', serif;
    font-size:14px;
    font-weight:600;
    color:var(--cream);
    margin-bottom:10px;
  }
  .tour-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 0;
    border-bottom:1px solid var(--border);
  }
  .tour-row:last-child{border-bottom:none;}
  .tour-extra{display:none;}
  .tour-extra.expanded{display:block;}
  .tour-date{
    font-size:11px;
    color:var(--gold);
    font-weight:600;
    width:76px;
    flex-shrink:0;

  const FAV_KEY = 'sing_favorites_v1';
  const FAV_SEED_KEY = 'sing_favorites_seeded';

  function loadFavorites(){
    try { return JSON.parse(localStorage.getItem(FAV_KEY) || '{}'); }
    catch(e){ return {}; }
  }
  function saveFavorites(favs){
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }
    catch(e){ /* storage unavailable, ignore */ }
  }
  function slugify(str){
    return String(str || '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
  }
  function songKey(artistKey, song){
    return artistKey + '::' + slugify(song.name) + '::' + slugify(song.album);
  }

  let favorites = loadFavorites();
  let currentArtistKey = 'home';

  // Track which songs are "new" since the last time this device opened the app.
  const SEEN_SONGS_KEY = 'sing_seen_songs_v1';
  function computeNewSongs(){
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem(SEEN_SONGS_KEY) || '[]'); }
    catch(e){ seen = []; }
    const seenSet = new Set(seen);
    const allNames = [];
    const newSet = new Set();
    let firstRun = seen.length === 0;
    Object.keys(ARTISTS).forEach(k => {
      ARTISTS[k].sections.forEach(sec => {
        if(sec.title === 'Favorites') return; // virtual section, songs counted elsewhere
        sec.songs.forEach(s => {
          allNames.push(s.name);
          if(!seenSet.has(s.name)) newSet.add(s.name);
        });
      });
    });
    try { localStorage.setItem(SEEN_SONGS_KEY, JSON.stringify(allNames)); } catch(e){}
    // Don't flag every song as "new" on someone's very first visit ever.
    return firstRun ? new Set() : newSet;
  }
  const NEW_SONGS = computeNewSongs();
  function artistHasNew(key){
    return ARTISTS[key].sections.some(sec => sec.title !== 'Favorites' && sec.songs.some(s => NEW_SONGS.has(s.name)));
  }

  // Seed favorites once from the original hardcoded Favorites sections
  if(!localStorage.getItem(FAV_SEED_KEY)){
    Object.keys(ARTISTS).forEach(key => {
      const favSec = ARTISTS[key].sections.find(s => s.title === 'Favorites');
      if(favSec){
        favSec.songs.forEach(s => {
          favorites[songKey(key, s)] = { artistKey: key, name: s.name, album: s.album, note: s.note || null };
        });
      }
    });
    saveFavorites(favorites);
    try { localStorage.setItem(FAV_SEED_KEY, '1'); } catch(e){}
  }

  function isFavorite(artistKey, song){
    return !!favorites[songKey(artistKey, song)];
  }

  function toggleFavorite(evt, artistKey, name, album, note){
    evt.stopPropagation();
    const song = { name: name, album: album, note: note || null };
    const k = songKey(artistKey, song);
    if(favorites[k]){
      delete favorites[k];
    } else {
      favorites[k] = { artistKey: artistKey, name: name, album: album, note: note || null };
    }
    saveFavorites(favorites);
    renderArtist(currentArtistKey);
  }

  function esc(str){
    return String(str).replace(/'/g, "\\'");
  }

  function toggleAlbum(head){
    const album = head.parentElement;
    const wasOpen = album.classList.contains('open');
    document.querySelectorAll('.album.open').forEach(a => a.classList.remove('open'));
    if(!wasOpen) album.classList.add('open');
  }

  function toggleBio(){
    const text = document.getElementById('bioText');
    const btn = document.getElementById('bioToggle');
    const isExpanded = text.classList.toggle('expanded');
    btn.textContent = isExpanded ? 'Read less' : 'Read more';
  }

  function toggleTourDates(){
    const extra = document.getElementById('tourExtra');
    const btn = document.getElementById('tourToggle');
    const extraCount = extra.querySelectorAll('.tour-row').length;
    const isExpanded = extra.classList.toggle('expanded');
    btn.textContent = isExpanded ? 'Show less' : `Show ${extraCount} more dates`;
  }

  function openShare(){
    const url = window.location.href;
    document.getElementById('shareQr').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
    document.getElementById('shareOverlay').classList.add('show');
  }
  function closeShare(){
    document.getElementById('shareOverlay').classList.remove('show');
  }
  function copyShareLink(){
    const url = window.location.href;
    const btn = document.querySelector('.share-copy-btn');
    if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(() => {
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; }, 1500);
      }).catch(() => {});
    }
  }

  function getAllSongsFlat(){
    const list = [];
    Object.keys(ARTISTS).forEach(key => {
      const seen = new Set();
      ARTISTS[key].sections.forEach(sec => {
        if(sec.title === 'Favorites') return; // avoid duplicate entries from the virtual Favorites section
        sec.songs.forEach(s => {
          const dupKey = slugify(s.name) + '::' + slugify(s.album);
          if(seen.has(dupKey)) return;
          seen.add(dupKey);
          list.push({ name: s.name, album: s.album, note: s.note || null, artistKey: key, artistName: ARTISTS[key].name });
        });
      });
    });
    return list;
  }
  const ALL_SONGS_FLAT = getAllSongsFlat();

  function openSearch(){
    document.getElementById('searchOverlay').classList.add('show');
    const input = document.getElementById('searchInput');
    input.value = '';
    runSearch('');
    setTimeout(() => input.focus(), 50);
  }
  function closeSearch(){
    document.getElementById('searchOverlay').classList.remove('show');
  }
  function runSearch(query){
    const q = query.trim().toLowerCase();
    const resultsEl = document.getElementById('searchResults');
    const matches = q === ''
      ? []
      : ALL_SONGS_FLAT.filter(s =>
          s.name.toLowerCase().includes(q) ||
          s.album.toLowerCase().includes(q) ||
          s.artistName.toLowerCase().includes(q)
        );
    if(q === ''){
      resultsEl.innerHTML = `<p class="search-empty">Start typing to search both artists' catalogs.</p>`;
      return;
    }
    if(matches.length === 0){
      resultsEl.innerHTML = `<p class="search-empty">No songs found for "${esc(query)}".</p>`;
      return;
    }
    resultsEl.innerHTML = matches.map(s => `
      <div class="search-result" onclick="closeSearch(); openSheet('${esc(s.name)}','${esc(s.album)}','${esc(s.artistName)}')">
        <div class="search-result-text">
          <span class="search-result-name">${s.name}${NEW_SONGS.has(s.name) ? ` <span class="new-badge">NEW</span>` : ''}</span>
          <span class="search-result-meta">${s.artistName} · ${s.album}</span>
        </div>
        <span class="play-dot">▸</span>
      </div>
    `).join('');
  }

  function openSheet(song, albumLabel, artistName){
    document.getElementById('sheetSong').textContent = song;
    document.getElementById('sheetAlbum').textContent = albumLabel;
    const q = encodeURIComponent(song.replace(/\(.*?\)/g,'').trim() + ' ' + (artistName || 'Josiah Queen'));
    const directId = SPOTIFY_TRACK_IDS[slugify(song)];
    document.getElementById('linkSpotify').href = directId
      ? `https://open.spotify.com/track/${directId}`
      : `https://open.spotify.com/search/${q}`;
    const appleId = APPLE_TRACK_IDS[slugify(song)];
    document.getElementById('linkApple').href = appleId
      ? (appleId.startsWith('album:')
          ? `https://music.apple.com/us/album/${appleId.slice(6)}`
          : `https://music.apple.com/us/song/${slugify(song)}/${appleId}`)
      : `https://music.apple.com/search?term=${q}`;
    const amazonId = AMAZON_TRACK_IDS[slugify(song)];
    document.getElementById('linkAmazon').href = amazonId
      ? `https://music.amazon.com/${amazonId}`
      : `https://music.amazon.com/search/${q}`;
    document.getElementById('overlay').classList.add('show');
    setNowPlaying(song, albumLabel, artistName);
  }
  function closeSheet(){
    document.getElementById('overlay').classList.remove('show');
  }

  const NOW_PLAYING_KEY = 'sing_now_playing_v1';

  function setNowPlaying(song, albumLabel, artistName){
    const np = { song, albumLabel, artistName };
    try { localStorage.setItem(NOW_PLAYING_KEY, JSON.stringify(np)); } catch(e){}
    renderNowPlayingBar(np);
  }

  function loadNowPlaying(){
    try {
      const raw = localStorage.getItem(NOW_PLAYING_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e){ return null; }
  }

  function renderNowPlayingBar(np){
    const bar = document.getElementById('nowPlayingBar');
    const content = document.getElementById('content');
    if(!np){
      bar.classList.remove('show');
      content.classList.remove('has-now-playing');
      return;
    }
    document.getElementById('npSong').textContent = np.song;
    document.getElementById('npArtist').textContent = np.artistName || '';
    document.getElementById('npArt').textContent = (np.song || '♪').charAt(0).toUpperCase();
    bar.classList.add('show');
    content.classList.add('has-now-playing');
  }

  function reopenNowPlaying(){
    const np = loadNowPlaying();
    if(np) openSheet(np.song, np.albumLabel, np.artistName);
  }

  function dismissSplash(){
    document.getElementById('splash').classList.add('hide');
  }

  renderArtist('home');
